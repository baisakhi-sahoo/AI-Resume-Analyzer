<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerBoostAI - Upload Resume</title>
</head>

<body>

<h1>Analyze Your Resume</h1>

<p>Upload your resume to get an ATS and AI-powered analysis.</p>

<form action="analyze" method="post" enctype="multipart/form-data">

    <label for="resume">Choose your resume:</label>

    <input type="file"
           id="resume"
           name="resume"
           accept=".pdf,.doc,.docx"
           required>

    <br><br>

    <button type="submit">
        Analyze Resume
    </button>

</form>

</body>
</html>
